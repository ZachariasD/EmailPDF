<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
        :root {
            --primary: #0f6cbd;
            --primary-hover: #115ea3;
            --text-main: #242424;
            --text-muted: #616161;
            --bg-base: #ffffff;
            --bg-subtle: #f5f5f5;
            --border-light: #e0e0e0;
            --radius: 6px;
            --transition: 0.2s ease;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            padding: 20px;
            margin: 0;
            box-sizing: border-box;
            color: var(--text-main);
            background: var(--bg-base);
        }

        .label {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
            letter-spacing: 0.2px;
        }

        /* Tab Navigation */
        .tabs {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-light);
        }
        
        .tab-link {
            padding: 8px 4px;
            cursor: pointer;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            font-size: 14px;
            color: var(--text-muted);
            transition: var(--transition);
        }
        
        .tab-link:hover {
            color: var(--text-main);
        }
        
        .tab-link.active {
            color: var(--primary);
            font-weight: 600;
            border-bottom: 2px solid var(--primary);
        }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Recent Projects */
        .quick-container {
            margin-bottom: 24px;
        }
        
        .quick-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 160px;
            overflow-y: auto;
        }
        
        .quick-btn {
            background-color: var(--bg-base);
            color: var(--text-main);
            border: 1px solid var(--border-light);
            width: 100%;
            padding: 10px 14px;
            font-size: 13px;
            cursor: pointer;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: var(--radius);
            transition: var(--transition);
        }
        
        .quick-btn:hover {
            background-color: var(--bg-subtle);
            border-color: #d1d1d1;
        }
        
        .arrow-icon {
            color: var(--text-muted);
            font-size: 16px;
        }

        /* Directory Browser */
        #currentPathDisplay {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            word-break: break-all;
            font-family: monospace;
        }
        
        .directory-box {
            border: 1px solid var(--border-light);
            max-height: 240px;
            overflow-y: auto;
            margin-bottom: 20px;
            border-radius: var(--radius);
            background: var(--bg-base);
        }
        
        .folder-item {
            padding: 10px 14px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-light);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: var(--transition);
        }
        
        .folder-item:last-child { border-bottom: none; }
        .folder-item:hover { background-color: var(--bg-subtle); }
        .folder-item.selected {
            background-color: #f0f6ff;
            font-weight: 600;
        }
        
        .folder-icon {
            width: 18px;
            height: 18px;
            fill: #dcb67a;
            flex-shrink: 0;
        }

        /* Standard Controls */
        .standard-btn {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }
        
        .standard-btn:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }
        
        .standard-btn:disabled {
            background-color: var(--bg-subtle);
            color: #a19f9d;
            border: 1px solid var(--border-light);
            cursor: not-allowed;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 16px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            box-sizing: border-box;
            font-family: inherit;
            font-size: 13px;
            color: var(--text-main);
            background-color: var(--bg-base);
            transition: var(--transition);
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23616161' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 14px;
        }
        
        input[type="text"] {
            background-image: none;
        }
        
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(15, 108, 189, 0.2);
        }

        #status, #settingsStatus, #aiSummary {
            font-size: 13px;
            margin-top: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="tabs">
        <button class="tab-link active" onclick="openTab(event, 'archive')">Archive</button>
        <button class="tab-link" onclick="openTab(event, 'insights')">Insights</button>
        <button class="tab-link" onclick="openTab(event, 'settings')">Settings</button>
    </div>

    <div id="archive" class="tab-content active">
        <div id="quickSection" class="quick-container" style="display: block;">
            <div class="label">Recent Projects</div>
            <div id="quickList" class="quick-list">
                </div>
        </div>

        <div class="label">Browse Directory</div>
        <div id="currentPathDisplay">/Project_Folder/</div>
        <div id="directoryBrowser" class="directory-box">
            <div style="padding:12px; color:var(--text-muted); font-size:13px;">Connecting...</div>
        </div>
        
        <button id="executeBtn" class="standard-btn" disabled>Archive Email</button>
        <div id="status"></div>
    </div>

    <div id="insights" class="tab-content">
        <div class="label">Select Project to Analyze</div>
        <select id="projectDropdown">
            <option value="">-- Choose a project --</option>
        </select>
    
        <button id="analyzeBtn" class="standard-btn">Analyze Project Context</button>
        <div id="aiSummary"></div>
    </div>
