<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 16px; margin: 0; }
        label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 6px; }
        select, button { width: 100%; padding: 8px; margin-bottom: 12px; box-sizing: border-box; font-size: 14px; }
        button { background-color: #0078d4; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:disabled { background-color: #c8c8c8; cursor: not-allowed; }
        #status { font-size: 12px; margin-top: 10px; color: #333; }
    </style>
</head>
<body>
    <label for="projectSelect">Target Project Destination</label>
    <select id="projectSelect">
        <option value="">Loading projects...</option>
    </select>
    
    <button id="executeBtn" disabled>Archive Email</button>
    <div id="status"></div>

    <script src="taskpane.js"></script>
</body>
</html>
